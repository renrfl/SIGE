{% extends "base.html" %}

{% block title %}
Login Administrativo
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-4">

        <div class="card shadow-sm">

            <div class="card-header bg-success text-white">

                Acesso Administrativo

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="login"
                            class="form-label">

                            Usuário

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="login"
                            name="login"
                            autocomplete="username"
                            autofocus
                            required>

                    </div>

                    <div class="mb-3">

                        <label
                            for="senha"
                            class="form-label">

                            Senha

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success w-100">

                        Entrar

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
