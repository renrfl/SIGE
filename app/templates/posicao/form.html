{% extends "base.html" %}

{% block title %}

{% if posicao %}
Editar Posição
{% else %}
Nova Posição
{% endif %}

{% endblock %}

{% block content %}

<div class="container mt-4">

    {% if posicao %}
        <h2>Editar Posição</h2>
    {% else %}
        <h2>Nova Posição</h2>
    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Nome da Posição
            </label>

            <input
                type="text"
                name="nome"
                class="form-control"
                maxlength="50"
                required
                value="{{ posicao.nome if posicao else '' }}">

        </div>

        <div class="mb-3">

            <label class="form-label">
                Nível
            </label>

            <select
                name="nivel_id"
                class="form-select"
                required>

                <option value="">
                    Selecione um nível
                </option>

                {% for nivel in niveis %}

                    <option
                        value="{{ nivel.id }}"
                        {% if posicao and posicao.nivel_id == nivel.id %}
                            selected
                        {% endif %}>

                        {{ nivel.modulo.predio.rua.nome }}
                        →
                        {{ nivel.modulo.predio.nome }}
                        →
                        {{ nivel.modulo.nome }}
                        →
                        {{ nivel.nome }}

                    </option>

                {% endfor %}

            </select>

        </div>

        <button
            type="submit"
            class="btn btn-success">

            Salvar

        </button>

        <a
            href="{{ url_for('posicao.listar') }}"
            class="btn btn-secondary">

            Cancelar

        </a>

    </form>

</div>

{% endblock %}
