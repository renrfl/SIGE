{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow-sm">

                <div class="card-header">

                    <h5 class="mb-0">
                        Alterar senha
                    </h5>

                </div>

                <div class="card-body">

                    <div class="mb-4">

                        <strong>Usuário:</strong>
                        {{ usuario.nome }}

                        <br>

                        <span class="text-muted">
                            Login: {{ usuario.login }}
                        </span>

                    </div>

                    <form method="POST">

                        <div class="mb-3">

                            <label
                                for="senha"
                                class="form-label">

                                Nova senha

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="senha"
                                name="senha"
                                required
                                autocomplete="new-password">

                        </div>

                        <div class="mb-3">

                            <label
                                for="confirmar_senha"
                                class="form-label">

                                Confirmar nova senha

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="confirmar_senha"
                                name="confirmar_senha"
                                required
                                autocomplete="new-password">

                        </div>

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success">

                                Salvar senha

                            </button>

                            <a
                                href="{{ url_for('usuario.listar') }}"
                                class="btn btn-secondary">

                                Cancelar

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
