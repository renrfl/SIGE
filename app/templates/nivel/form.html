{% extends "base.html" %}

{% block title %}
{% if nivel %}Editar Nível{% else %}Novo Nível{% endif %}
{% endblock %}

{% block content %}
<div class="container mt-4">

<h2>{% if nivel %}Editar Nível{% else %}Novo Nível{% endif %}</h2>

<form method="POST">

<div class="mb-3">
<label class="form-label">Nome</label>
<input type="text" class="form-control" name="nome" required value="{{ nivel.nome if nivel else '' }}">
</div>

<div class="mb-3">
<label class="form-label">Módulo</label>

<select class="form-select" name="modulo_id" required>

<option value="">Selecione...</option>

{% for modulo in modulos %}
<option value="{{ modulo.id }}" {% if nivel and nivel.modulo_id==modulo.id %}selected{% endif %}>
{{ modulo.predio.rua.nome }} → {{ modulo.predio.nome }} → {{ modulo.nome }}{% if modulo.niveis_cadastrados %} — NÍVEIS: {{ modulo.niveis_cadastrados }}{% endif %}
</option>
{% endfor %}

</select>

</div>

<button class="btn btn-success" type="submit">Salvar</button>

<a href="{{ url_for('nivel.listar') }}" class="btn btn-secondary">Cancelar</a>

</form>

</div>
{% endblock %}
