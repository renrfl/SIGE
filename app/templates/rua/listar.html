{% extends "base.html" %}

{% block title %}Ruas{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Ruas</h2>

    <a href="{{ url_for('rua.novo') }}" class="btn btn-success">
        Nova Rua
    </a>
</div>

<table class="table table-striped table-hover">

    <thead>

        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th width="180">Ações</th>
        </tr>

    </thead>

    <tbody>

        {% for rua in ruas %}

        <tr>

            <td>{{ rua.id }}</td>

            <td>{{ rua.nome }}</td>

            <td>{{ rua.descricao }}</td>

            <td>

                <a href="{{ url_for('rua.editar', id=rua.id) }}"
                   class="btn btn-warning btn-sm">

                    Editar

                </a>

                <a href="{{ url_for('rua.excluir', id=rua.id) }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Excluir esta rua?')">

                    Excluir

                </a>

            </td>

        </tr>

        {% endfor %}

    </tbody>

</table>

{% endblock %}
