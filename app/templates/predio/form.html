{% extends "base.html" %}

{% block title %}

{% if predio %}
Editar Prédio
{% else %}
Novo Prédio
{% endif %}

{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-success text-white">

            {% if predio %}
                Editar Prédio
            {% else %}
                Novo Prédio
            {% endif %}

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Rua
                    </label>

                    <select
                        name="rua_id"
                        class="form-select"
                        required>

                        <option value="">
                            Selecione...
                        </option>

                        {% for rua in ruas %}

                            <option
                                value="{{ rua.id }}"
                                {% if predio and predio.rua_id == rua.id %}selected{% endif %}>

                                {{ rua.nome }}

                            </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Nome do Prédio
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        maxlength="50"
                        required
                        value="{{ predio.nome if predio else '' }}">

                </div>

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-success">

                        Salvar

                    </button>

                    <a
                        href="{{ url_for('predio.listar') }}"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
