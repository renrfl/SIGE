{% extends "base.html" %}

{% block title %}

    {% if produto %}
        Editar Produto - SIGE
    {% else %}
        Novo Produto - SIGE
    {% endif %}

{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card">

            <div class="card-header">

                {% if produto %}
                    Editar produto
                {% else %}
                    Cadastrar produto
                {% endif %}

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="codigo"
                            class="form-label">

                            Código do produto

                        </label>

                        <input
                            type="number"
                            class="form-control"
                            id="codigo"
                            name="codigo"
                            min="1"
                            required
                            value="{{ produto.codigo if produto else '' }}">

                    </div>

                    <div class="mb-3">

                        <label
                            for="codigo_barras"
                            class="form-label">

                            Código de barras

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="codigo_barras"
                            name="codigo_barras"
                            maxlength="30"
                            required
                            value="{{ produto.codigo_barras if produto else '' }}">

                    </div>

                    <div class="mb-3">

                        <label
                            for="descricao"
                            class="form-label">

                            Descrição

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="descricao"
                            name="descricao"
                            maxlength="200"
                            required
                            value="{{ produto.descricao if produto else '' }}">

                    </div>

                    <div class="d-flex justify-content-between">

                        <a
                            href="{{ url_for('produto.listar') }}"
                            class="btn btn-secondary">

                            Voltar

                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary">

                            {% if produto %}
                                Salvar alterações
                            {% else %}
                                Cadastrar produto
                            {% endif %}

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
