{% extends "base.html" %}

{% block title %}
Etiquetas
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="card">

            <div class="card-header bg-success text-white">

                Gerar Etiqueta de Produto

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label
                            for="codigo"
                            class="form-label">

                            Código interno do produto

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="codigo"
                            name="codigo"
                            inputmode="numeric"
                            autofocus
                            required>

                    </div>

                    <button
                        type="submit"
                        class="btn btn-success">

                        Gerar etiqueta

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
