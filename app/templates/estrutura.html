{% extends "base.html" %}

{% block title %}
Estrutura Física
{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Estrutura Física</h2>

    <button class="btn btn-success">
        Configurar Empresa
    </button>
</div>

<div class="card mb-3">
    <div class="card-header">
        Empresa
    </div>

    <div class="card-body">
        <strong>Distribuidora Timbiras</strong>
    </div>
</div>

<div class="row">

    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-body text-center">

                <h5>Ruas</h5>

                <h2>0</h2>

                <button class="btn btn-outline-secondary btn-sm">
                    Gerenciar
                </button>

            </div>
        </div>
    </div>

    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-body text-center">

                <h5>Prédios</h5>

                <h2>0</h2>

                <button class="btn btn-outline-secondary btn-sm">
                    Gerenciar
                </button>

            </div>
        </div>
    </div>

    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-body text-center">

                <h5>Módulos</h5>

                <h2>0</h2>

                <button class="btn btn-outline-secondary btn-sm">
                    Gerenciar
                </button>

            </div>
        </div>
    </div>

    <div class="col-md-6 mb-3">
        <div class="card">
            <div class="card-body text-center">

                <h5>Níveis</h5>

                <h2>0</h2>

                <button class="btn btn-outline-secondary btn-sm">
                    Gerenciar
                </button>

            </div>
        </div>
    </div>

    <div class="col-md-12">
        <div class="card">
            <div class="card-body text-center">

                <h5>Posições</h5>

                <h2>0</h2>

                <button class="btn btn-outline-secondary btn-sm">
                    Gerenciar
                </button>

            </div>
        </div>
    </div>

</div>

{% endblock %}
